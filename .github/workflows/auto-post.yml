name: auto-post
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-24.04    # ← 显式锁定 24.04，避开 Ubuntu 26 的坑
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5    # ← 升级到 v5，支持 Node 24
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6    # ← 升级到 v6，支持 Node 24
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          GSORG_TOKEN: ${{ secrets.GSORG_TOKEN }}
          AI_KEY: ${{ secrets.AI_KEY }}
