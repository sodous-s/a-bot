name: auto-post
on:
  schedule:
    - cron: "0 * * * *"    
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          GSORG_TOKEN: ${{ secrets.GSORG_TOKEN }}
          AI_KEY: ${{ secrets.AI_KEY }}
