name: auto-post
on:
  schedule:
    - cron: "*/10 * * * *"    # 每5分钟触发一次
  workflow_dispatch:          # 保留手动触发

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3        # 发一条用不了多久，3分钟够
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          GSORG_TOKEN: ${{ secrets.GSORG_TOKEN }}
          AI_KEY: ${{ secrets.AI_KEY }}
